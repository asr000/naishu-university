<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffc400">
  <title>奶鼠大学 · 校园入口</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fffdf5; color: #302a16; font-family: "Microsoft YaHei", system-ui, sans-serif; }
    main { width: min(100% - 40px, 640px); margin: 70px auto; text-align: center; }
    .badge { display: inline-block; border: 1px solid #e7dcae; border-radius: 30px; padding: 8px 18px; color: #786933; font-size: 13px; }
    .logo { display: block; width: 160px; height: auto; margin: 30px auto 20px; }
    h1 { margin: 0; font-size: clamp(36px, 8vw, 52px); letter-spacing: 6px; }
    .domain { margin: 14px 0 30px; color: #89773c; }
    .intro { margin-bottom: 34px; color: #6f6850; line-height: 1.8; }
    .links { display: grid; gap: 16px; }
    .card { display: flex; align-items: center; text-align: left; gap: 18px; padding: 24px; border: 1px solid #ecdfad; border-radius: 20px; background: white; text-decoration: none; color: inherit; }
    a.card:hover { border-color: #bd9000; transform: translateY(-2px); }
    a.card:focus-visible { outline: 3px solid #896700; outline-offset: 4px; }
    .primary { background: #ffc400; border-color: #ffc400; }
    .icon { font-size: 30px; }
    .card strong { display: block; font-size: 20px; margin-bottom: 7px; }
    .card small { color: #6f602b; font-size: 14px; }
    .arrow { margin-left: auto; font-size: 24px; }
    footer { margin-top: 38px; color: #837c65; font-size: 12px; line-height: 1.9; }
    @media (max-width: 480px) { main { margin: 36px auto; } .card { padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <span class="badge">校园链接 · App 下载</span>
    <img class="logo" src="logo.png" alt="黄色奶蛋大学图标">
    <h1>奶鼠大学</h1>
    <p class="domain">奶鼠大学.com</p>
    <p class="intro">上海大学官网、SHUYo 与 ShuVPN 下载入口。</p>
    <div class="links">
      <a class="card primary" id="school-link" href="https://www.shu.edu.cn/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">↗</span>
        <div><strong>上海大学官网</strong><small>www.shu.edu.cn</small></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="card" id="android-link" href="https://download.shuyo.work/ShuYo-v0.5.0-beta.apk">
        <span class="icon" aria-hidden="true">↓</span>
        <div><strong>SHUYo · Android 下载</strong><small>v0.5.0 Beta · APK 安装包</small></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="card" id="ios-link" href="https://testflight.apple.com/join/aENUC3G3" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">↗</span>
        <div><strong>SHUYo · iOS 测试</strong><small>前往 TestFlight 查看测试名额</small></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="card" id="shuvpn-link" href="https://github.com/shuosc/ShuVPN/releases" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">↗</span>
        <div><strong>ShuVPN · Android 下载</strong><small>前往 GitHub Releases 选择安装包</small></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>
    <footer>SHUYo 下载地址来自社区公告，版本与测试状态以发布方为准。</footer>
  </main>
</body>
</html>
